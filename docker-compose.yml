# Runs the full app locally: MongoDB + backend + frontend (nginx).
#   docker compose up --build      → http://localhost:8080
# Secrets (JWT_SECRET, OPENAI_API_KEY, EMAIL_*) are read from backend/.env.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/deutsch   # local container DB, not your Atlas cluster
      APP_URL: http://localhost:8080
      TRUST_PROXY: "1"
      PORT: "5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
