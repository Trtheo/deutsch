server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Resource uploads are capped at 1 MB by the backend
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;   # AI generation can be slow
  }

  # The service worker must never be cached, or updates won't reach users
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets can be cached forever
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/lesson/..., /exams, ...) all serve index.html
  location / {
    try_files $uri /index.html;
  }
}
