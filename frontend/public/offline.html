<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Deutsch Lernen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .flag { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #9ca3af; font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #facc15;
      color: #111827;
      font-weight: 700;
      padding: 0.6rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
    }
    .tip {
      margin-top: 2rem;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 1rem;
      padding: 1rem 1.5rem;
      max-width: 360px;
      font-size: 0.85rem;
      color: #d1d5db;
      line-height: 1.6;
    }
    .tip strong { color: #facc15; }
  </style>
</head>
<body>
  <div class="flag">🇩🇪</div>
  <h1>You are offline</h1>
  <p>No internet connection detected.<br/>Previously visited lessons are still available.</p>
  <button class="badge" onclick="location.reload()">Try again</button>
  <div class="tip">
    <strong>💡 Tip:</strong> Lessons you have already opened are cached and work fully offline — including pronunciation, flashcards, and the phrase book.
  </div>
</body>
</html>
