<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/logo.svg" type="image/svg+xml" />

    <!-- Mobile app behaviour -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Deutsch Lernen" />
    <meta name="theme-color" content="#facc15" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)" />

    <meta name="description" content="Learn German from A1 to B1: lessons, practice exams, certificate preparation, a translator and pronunciation practice" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Deutsch Lernen</title>
    <script>
      // Set the theme before the page is drawn (no white flash on dark devices). Same rule as src/theme.js:
      // the user's saved choice, otherwise the device setting, otherwise light.
      (function () {
        try {
          var c = localStorage.getItem('theme_choice');
          var dark = c ? c === 'dark' : !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
