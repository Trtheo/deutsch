# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the API (Docker) and the website (static). The database is your MongoDB Atlas cluster.
services:
  - type: web
    name: deutsch-lernen-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false              # paste your Atlas connection string when prompted
      - key: JWT_SECRET
        generateValue: true      # Render generates a long random secret
      - key: OPENAI_API_KEY
        sync: false              # optional: only for user-generated AI lessons
      - key: EMAIL_USER
        sync: false              # optional: Gmail address for password-reset emails
      - key: EMAIL_PASS
        sync: false              # optional: Gmail app password
      - key: APP_URL
        sync: false              # the website URL, e.g. https://deutsch-lernen.onrender.com (used in reset emails)
      - key: TRUST_PROXY
        value: "1"               # Render sits in front of the app; needed for correct rate limiting
      - key: NODE_ENV
        value: production

  - type: web
    name: deutsch-lernen
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Public address of the API service (fromService "host" is the internal name and doesn't work in browsers).
      # If you recreate the API and Render gives it a different suffix, update this value.
      - key: REACT_APP_API_HOST
        value: deutsch-lernen-api-67oz.onrender.com
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite              # client-side routes (/lesson/..., /exams) serve the app
        source: /*
        destination: /index.html
