# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the API (Docker). The database is your MongoDB Atlas cluster.
# The website is a separate Render Static Site (created in the dashboard, see README "Deploying to Render").
services:
  - type: web
    name: deutsch-lernen-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URI
        sync: false              # paste your Atlas connection string when prompted
      - key: JWT_SECRET
        generateValue: true      # Render generates a long random secret
      - key: DEEPL_API_KEY
        sync: false              # optional: better translations (DeepL free plan); without it the free MyMemory service is used
      - key: EMAIL_USER
        sync: false              # optional: Gmail address for password-reset emails
      - key: EMAIL_PASS
        sync: false              # optional: Gmail app password
      - key: APP_URL
        sync: false              # the website URL, e.g. https://deutsch-lernen.onrender.com (used in reset emails)
      - key: TRUST_PROXY
        value: "1"               # Render sits in front of the app; needed for correct rate limiting
      - key: NODE_ENV
        value: production

